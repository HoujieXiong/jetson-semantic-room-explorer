/rgbd_odometry:
  ros__parameters:
    use_sim_time: true
    frame_id: camera_link
    odom_frame_id: odom
    publish_tf: true
    publish_null_when_lost: true
    approx_sync: true
    approx_sync_max_interval: 0.005
    topic_queue_size: 30
    sync_queue_size: 30
    qos: 1
    qos_camera_info: 1
    wait_for_transform: 0.2
    wait_imu_to_init: false
    # Disable aggressive frame dropping during bursty bag replay.
    always_process_most_recent_frame: false
    Odom/ResetCountdown: "0"
