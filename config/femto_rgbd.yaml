/camera/camera:
  ros__parameters:
    camera_name: camera
    color_width: 1280
    color_height: 720
    color_fps: 15
    color_format: MJPG
    enable_color: true
    enable_color_undistortion: true
    depth_width: 640
    depth_height: 576
    depth_fps: 15
    depth_format: Y16
    enable_depth: true
    depth_registration: true
    align_mode: HW
    align_target_stream: COLOR
    enable_depth_scale: true
    frame_aggregate_mode: full_frame
    enable_frame_sync: true
    sync_mode: standalone
    time_domain: global
    color_qos: default
    depth_qos: default
    color_camera_info_qos: default
    depth_camera_info_qos: default
    publish_tf: true
    tf_publish_rate: 0.0
    enable_ir: false
    enable_accel: false
    enable_gyro: false
    enable_sync_output_accel_gyro: false
    enable_point_cloud: false
    enable_colored_point_cloud: false
    enable_hole_filling_filter: false
    enable_frame_drop_log: true
    enumerate_net_device: false
    uvc_backend: libuvc
